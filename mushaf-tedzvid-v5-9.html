<!doctype html>
<html lang="bs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#063f2d"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Mushaf Tajweed · Proba</title>
<style>
@font-face{font-family:'Amiri Quran';src:url('./fonts/amiri-quran.woff') format('woff');font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#eee3c9;color:#143c2f;font:16px system-ui,-apple-system,sans-serif}
header{position:sticky;top:0;z-index:9;background:#03432e;color:#fff0c8;border-bottom:3px double #c5a15d;padding:12px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header a{color:inherit;text-decoration:none;font-weight:650}header strong{font-size:17px}
main{max-width:760px;margin:auto;padding:12px 8px 50px}
.controls{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0}
button,select,input{font:inherit;padding:9px;border:1px solid #b18d48;border-radius:10px;background:#f8eac7;color:#153c2f}
button{cursor:pointer}button:disabled{opacity:.4}input[type=number]{width:78px;text-align:center}
.reader{--ink:#12291e;--paper:#eef4e4;--rule:#afbc9c;position:relative;margin:auto;max-width:650px;padding:20px 12px;background:var(--paper);border:6px double #b79040;box-shadow:inset 0 0 0 4px #06543c;color:var(--ink);min-height:360px}
.reader[data-theme=night]{--ink:#fff8e4;--paper:#112018;--rule:#415646}
.reader[data-theme=cream]{--paper:#fff1d2;--rule:#dac49a}
.reader h1{text-align:center;font:600 20px Georgia,serif;margin:0 0 8px;color:var(--ink)}
#lines{direction:rtl;display:flex;flex-direction:column;gap:0}
.qline{direction:rtl;display:block;text-align:center;width:100%;min-height:3.15em;white-space:nowrap;border-bottom:1px solid var(--rule);font-size:clamp(17px,4.3vw,28px);font-weight:400;line-height:1.55}
.qline:last-child{border-bottom:0}.qword{display:inline-block;text-align:center;font-family:'Amiri Quran','Geeza Pro',serif;white-space:nowrap;vertical-align:middle;position:relative;top:.72em}
.ayah-marker{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:1.9em;height:1.9em;min-width:1.9em;border:2px double #ad873d;border-radius:50%;color:#15472f;background:#fff5d5;box-shadow:inset 0 0 0 2px #e3c785;font:400 .65em/1 'Amiri Quran','Geeza Pro',serif;white-space:nowrap;vertical-align:middle;position:relative;top:.94em;padding:0}
.hizb-marker{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;color:#b88c31;font:400 1.15em/1 'Amiri Quran','Geeza Pro',serif}

#fallback{display:none;width:100%;height:auto;max-height:calc(100dvh - 245px);object-fit:contain}
#message{min-height:30px;text-align:center;font-size:13px;margin:9px auto;color:#355a49}
.note{max-width:650px;margin:14px auto;font-size:12px;line-height:1.5;color:#57675c}
body:has(.reader[data-theme=night]){background:#182019;color:#e9ead9}
body:has(.reader[data-theme=night]) #message,body:has(.reader[data-theme=night]) .note{color:#c3d0bc}
label{font-size:13px;font-weight:600}
@media(max-width:420px){.reader{padding:13px 7px}.qline{font-size:clamp(15px,4.5vw,21px)}.controls{gap:5px}}
body{overflow-x:hidden}main,.reader,#lines{min-width:0;max-width:100%}.qline{max-width:100%;overflow:visible}.ayah-marker{margin-inline:.04em} .ayah-digits{display:block;line-height:1;transform:translateY(-.38em)}

.tj-short{color:#008a42}.tj-madd{color:#af6619}.tj-nasal{color:#0785b3}.tj-echo{color:#bd2d5c}.tj-silent{color:#819087}
.reader[data-theme=night] .tj-short{color:#4cdb90}.reader[data-theme=night] .tj-madd{color:#f7a955}.reader[data-theme=night] .tj-nasal{color:#6cbeea}.reader[data-theme=night] .tj-echo{color:#fc789d}
.tj-tools{display:flex;justify-content:center;gap:10px;align-items:center;margin:6px auto 10px;font-size:13px}
.tj-tools input{accent-color:#00824c}
.surah-heading,.surah-bismillah{display:inline-block;text-align:center;font-family:'Amiri Quran','Geeza Pro',serif;white-space:normal;position:relative;top:.72em}
.surah-heading{color:#9a762e}
.waqf-paired{display:inline-block;position:relative;top:1.10em;vertical-align:middle;margin-inline:.08em;color:var(--ink);font:400 .80em/1 'Amiri Quran','Geeza Pro',serif}
</style></head><body>
<header><a href="./">❮ Namaz Svijet</a><strong>Mushaf · Tedžvid v5.9</strong></header>
<main>
<div class="controls"><button id="prev">❮</button><label for="page">Stranica</label><input id="page" type="number" min="1" max="604" value="4"><span>/ 604</span><button id="next">❯</button>
<select id="theme" aria-label="Pozadina"><option value="green">Zelena</option><option value="cream">Krem</option><option value="night">Noćna</option></select></div>
<div class="tj-tools"><label><input type="checkbox" id="tajweedOn" checked> Tedžvid u bojama</label></div><div class="reader" id="reader" data-theme="green"><h1 id="heading">Stranica 4 / 604</h1><section id="lines" lang="ar" dir="rtl"></section><img id="fallback" alt="Originalna stranica Mushafa"></div>
<p id="message" role="status"></p>

</main>
<script>
'use strict';
const el=id=>document.getElementById(id);
const root='https://raw.githubusercontent.com/MohamadHajjRabee/quran-qcf4/main/pages/';
let current=4,run=0;

const tjColors={
 ham_wasl:'silent',laam_shamsiyah:'silent',slnt:'silent',
 madda_normal:'short',madda_permissible:'madd',madda_obligatory:'madd',madda_necessary:'madd',
 ghunnah:'nasal',idgham_ghunnah:'nasal',idgham_wo_ghunnah:'nasal',idgham_shafawi:'nasal',
 idgham_mutajanisayn:'nasal',idgham_mutaqaribayn:'nasal',ikhafa:'nasal',ikhafa_shafawi:'nasal',
 iqlab:'nasal',qalaqah:'echo'
};
const tjCache=new Map();
function splitTajweed(markup){
 const template=document.createElement('template');template.innerHTML=markup;
 const words=[];let parts=[];
 const flush=()=>{if(parts.length){words.push(parts);parts=[]}};
 function walk(node,rule){
  if(node.nodeType===3){
   for(const chunk of node.textContent.split(/(\s+)/u)){
    if(!chunk)continue;
    if(/^\s+$/u.test(chunk)){flush();continue;}
    const last=parts[parts.length-1];
    if(last && last.rule===rule)last.text+=chunk;
    else parts.push({text:chunk,rule});
   }
  }else if(node.nodeType===1){
   if(node.nodeName==='SPAN'&&node.classList.contains('end'))return;
   if(node.nodeName!=='TAJWEED'&&node.nodeName!=='SPAN')return;
   const next=node.nodeName==='TAJWEED'?(tjColors[node.getAttribute('class')]||null):rule;
   for(const child of node.childNodes)walk(child,next);
  }
 }
 for(const n of template.content.childNodes)walk(n,null);
 flush();return words;
}
async function loadTajweed(keys){
 const chapters=[...new Set(keys.map(key=>Number(key.split(':')[0])))];
 const result=new Map();
 await Promise.all(chapters.map(async chapter=>{
  if(!tjCache.has(chapter))tjCache.set(chapter,fetch('https://api.quran.com/api/v4/quran/verses/uthmani_tajweed?chapter_number='+chapter)
   .then(r=>{if(!r.ok)throw Error('API unavailable');return r.json()})
   .then(j=>{const map=new Map();for(const v of j.verses||[]){
    if(v.verse_key && typeof v.text_uthmani_tajweed==='string')map.set(v.verse_key,splitTajweed(v.text_uthmani_tajweed));
   }return map;}));
  try{for(const [key,val] of await tjCache.get(chapter))result.set(key,val)}
  catch{tjCache.delete(chapter)}
 }));
 return result;
}
async function colorTajweed(data,requestId){
 const words=data.lines.flatMap(l=>l.words.filter(w=>w.type==='word'));
 const lookup=await loadTajweed([...new Set(words.map(w=>w.verse_key))]);
 if(requestId!==run||!el('tajweedOn').checked)return;
 let colored=0,index=0;
 const nodes=[...el('lines').querySelectorAll('.qword')];
 for(const line of data.lines)for(const word of line.words){
  if(word.type!=='word')continue;
  const node=nodes[index++],original=word.text||'';
  if(!node||node.textContent!==original)continue;
  const segments=lookup.get(word.verse_key)?.[Number(word.position)-1];
  if(!segments || segments.map(s=>s.text).join('')!==original)continue;
  const frag=document.createDocumentFragment();let hasColor=false;
  for(const piece of segments){
   if(piece.rule){
    const mark=document.createElement('span');mark.className='tj-'+piece.rule;mark.textContent=piece.text;
    frag.append(mark);hasColor=true;
   }else frag.append(document.createTextNode(piece.text));
  }
  if(frag.textContent!==original)continue;
  node.replaceChildren(frag);
  if(node.textContent!==original){node.textContent=original;continue}
  if(hasColor)colored++;
 }
 if(requestId===run)el('message').textContent='Tedžvid: '+colored+' riječi sa potvrđenim pravilima · stranica '+current;
}

try{let p=Number(localStorage.getItem('ns_qcf_test_page'));if(Number.isInteger(p)&&p>=1&&p<=604)current=p;}catch{}
function fallback(page,reason){
 el('lines').replaceChildren();el('lines').hidden=true;
 const image=el('fallback');image.style.display='block';
 image.src='https://raw.githubusercontent.com/Miftah-Fentaw/Quran-Images/main/png/'+page+'.png';
 image.alt='Stranica '+page+' (originalna slika)';
 el('message').textContent=reason+' Prikazana je slika stranice.';
}
async function load(page){
 if(!Number.isInteger(page)||page<1||page>604)return;
 const id=++run;current=page;el('page').value=page;
 el('heading').textContent='Stranica '+page+' / 604';el('message').textContent='Učitavanje arapskog teksta…';
 el('prev').disabled=page===1;el('next').disabled=page===604;
 el('fallback').style.display='none';el('fallback').removeAttribute('src');el('lines').hidden=false;el('lines').replaceChildren();
 try{localStorage.setItem('ns_qcf_test_page',String(page))}catch{}
 try{
  const url=root+String(page).padStart(3,'0')+'.json';
  const response=await fetch(url);
  if(!response.ok)throw Error('Podaci za stranicu nisu dostupni.');
  const data=await response.json();
  if(!Array.isArray(data.lines)||!data.lines.length||!data.lines.every(line=>Array.isArray(line.words)))throw Error('Neispravni podaci o redovima.');
  if(id!==run)return;
  const group=document.createDocumentFragment();
  for(const line of data.lines){
   const row=document.createElement('div');row.className='qline';
   for(const word of line.words){
    const span=document.createElement('span');span.className='qword';
    // QCF markers contain placeholder strings such as V38 and Q.
    // Display actual verse numbers and quarter-hizb ornaments instead.
    if(word.type==='end'){
      const number=Number(String(word.verse_key||'').split(':')[1]);
      if(!Number.isInteger(number)||number<1||number>286)throw Error('Neispravan broj ajeta.');
      span.className='ayah-marker';
      const digits=document.createElement('span');
      digits.className='ayah-digits';
      digits.textContent=String(number).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[Number(d)]);
      span.append(digits);
      span.setAttribute('aria-label','Ajet '+number);
    }else if(word.type==='quarter'){
      span.className='hizb-marker';
      span.textContent='۞';
      span.setAttribute('aria-label','Oznaka četvrtine hizba');
    }else if(word.type==='word'){
      span.textContent=word.text || '';
      span.title=word.text || '';
    }else if(word.type==='surah_header'){
      span.className='surah-heading';
      // Quran-QCF4 places the surah title and basmala in a single
      // ornamental heading field, followed by a separate basmala line.
      // Keep only the title here so the basmala is not duplicated.
      span.textContent=(word.text||'').replace(/\s+بِسْمِ[\s\S]*$/u,'').trim();
    }else if(word.type==='bismillah'){
      span.className='surah-bismillah';
      span.textContent=word.text||'';
    }else{
      throw Error('Nepoznata oznaka u tekstu.');
    }
    row.append(span);
    // Al-Baqarah 2:2 contains two paired mu'anaqah pause signs.
    // The QCF4 words omit these ornaments, so add them as independent
    // markers AFTER the two original words, never altering their text.
    if(word.type==='word' && word.verse_key==='2:2' && (word.position===4 || word.position===5)){
      const waqf=document.createElement('span');
      waqf.className='waqf-paired';
      waqf.textContent='ۛ';
      waqf.setAttribute('aria-label','Znak uzajamnog zastajanja');
      row.append(waqf);
    }
    row.append(document.createTextNode(' '));
   }
   group.append(row);
  }
  el('lines').append(group);
  // Each source line remains one visual line; reduce size only when it
  // exceeds the available phone width, and center the entire line.
  const fitRows=()=>{
    el('lines').querySelectorAll('.qline').forEach(row=>{
      row.style.fontSize='';
      const available=row.clientWidth;
      const required=row.scrollWidth;
      if(available>0 && required>available){
        const base=parseFloat(getComputedStyle(row).fontSize);
        row.style.fontSize=(base*Math.min(1,(available-12)/required))+'px';
      }
    });
  };
  requestAnimationFrame(fitRows);
  if(document.fonts?.ready)document.fonts.ready.then(()=>{if(id===run)fitRows()});
  el('message').textContent='Stranica '+page+' · '+data.lines.length+' redova';
  if(el('tajweedOn').checked)colorTajweed(data,id).catch(()=>{if(id===run)el('message').textContent='Tedžvid nije dostupan; tekst ostaje nepromijenjen.'});
 }catch(error){if(id!==run)return;fallback(page,error?.message||'Font nije dostupan.');}
}
el('prev').onclick=()=>load(current-1);el('next').onclick=()=>load(current+1);
el('page').onchange=()=>load(Number(el('page').value));
el('theme').onchange=()=>{el('reader').dataset.theme=el('theme').value;};
el('tajweedOn').onchange=()=>load(current);
window.addEventListener('resize',()=>{const rows=el('lines').querySelectorAll('.qline');for(const row of rows){row.style.fontSize='';const width=row.clientWidth,full=row.scrollWidth;if(width>0&&full>width){row.style.fontSize=(parseFloat(getComputedStyle(row).fontSize)*(width-12)/full)+'px';}}},{passive:true});
load(current);
</script></body></html>
